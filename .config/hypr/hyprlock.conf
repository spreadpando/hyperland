# hyprlock — launched from the rofi power menu (Lock)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# colors follow hyprland.lua borders and the waybar accents

# $bar and $accent fonts come from theme.conf (bar_font, display_font) via theme-apply
source = $HOME/.config/hypr/hyprlock-fonts.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 0

    inner_color = rgba(0, 0, 0, 0.4)
    outer_color = rgb(ffffff)
    check_color = rgb(7A9CB8)
    fail_color  = rgb(B87A7A)
    font_color  = rgb(ffffff)

    font_family = $bar
    placeholder_text = <i>password</i>
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3

    position = 0, -80
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = $accent
    color = rgb(ffffff)

    position = 0, 60
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 16
    font_family = $bar
    color = rgb(B88A8A)

    position = 0, -10
    halign = center
    valign = center
}
